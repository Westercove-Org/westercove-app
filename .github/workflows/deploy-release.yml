name: deploy-release

# Build the Expo web SPA into a static nginx image and deploy it to the RELEASE
# stack on a published GitHub Release. Merge-to-main NO LONGER deploys
# (deploy-frontend.yml was removed).
#
# Single-environment release model: main.westercove.com serves this app; it calls
# the backend cross-origin at https://api.westercove.com (EXPO_PUBLIC_API_URL is
# baked at build time — no longer empty/same-origin).
#
# IMMUTABLE TAGS — do NOT revert to :latest. No staging => rollback = redeploy a
# previous release tag, which only works if each release image is a distinct,
# immutable tag pinned into the task definition. ECR tag-immutability MUST be ON
# for westercove-dev-frontend (set once, out of band).
#
# RECOVERY IF A RUN FAILS AFTER BUILD+PUSH: do NOT just re-run it — ECR tag-immutability
# rejects re-pushing the same tag, so the build step fails. Instead re-dispatch WITH that
# tag (workflow_dispatch, tag=<the tag>): it skips the build and deploys the already-pushed
# image.
#
# OIDC: the deploy runs inside the `release` GitHub Environment; the
# westercove-app-frontend-deploy role trust is scoped to
# repo:Westercove-Org/westercove-app:environment:release (a release runs on a TAG
# ref, so a branch-scoped trust would fail AssumeRoleWithWebIdentity).

on:
  # DEV auto-deploy: a push/merge to main builds the current checkout (git-SHA
  # immutable tag) and rolls the DEV frontend. The `release` GH environment has
  # NO required reviewers, so this is un-gated; and this workflow is hardcoded to
  # the westercove-dev-* frontend/cluster, so it can never target prod.
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Rollback only: an EXISTING image tag to redeploy. Leave EMPTY to build+deploy the current checkout (tagged with its git SHA)."
        required: false

concurrency:
  group: deploy-dev-frontend
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPO: 920887851546.dkr.ecr.us-east-1.amazonaws.com/westercove-dev-frontend
  ECS_CLUSTER: westercove-dev-cluster
  ECS_SERVICE: westercove-dev-frontend
  API_URL: https://api.westercove.com
  COGNITO_USER_POOL_ID: us-east-1_LCAAKP7s6
  COGNITO_CLIENT_ID: 6k23q0pm8n1m0u74e8ai79pcud

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: release          # env-scoped OIDC; no required reviewers (publishing a Release / dispatch is the deliberate act)
    steps:
      - uses: actions/checkout@v4

      # HARD GUARD: structurally dev-only. Fail fast if the target isn't dev so a
      # bad edit can't ship to prod (prod has no auto path at all).
      - name: Assert DEV-only target
        run: |
          set -euo pipefail
          if [ "${ECS_CLUSTER}" != "westercove-dev-cluster" ] || [ "${ECS_SERVICE}" != "westercove-dev-frontend" ]; then
            echo "REFUSING: target is not dev (${ECS_CLUSTER}/${ECS_SERVICE})." >&2; exit 1
          fi
          echo "Target confirmed dev: ${ECS_CLUSTER}/${ECS_SERVICE}"

      # Resolve tag + build mode:
      #  - release published      -> tag = release tag_name, BUILD
      #  - dispatch WITHOUT a tag  -> tag = git short SHA,    BUILD (deploy current main)
      #  - dispatch WITH a tag     -> tag = that tag,         NO build (rollback to existing)
      - name: Resolve tag + build mode
        id: tag
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"; BUILD=true
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"; BUILD=false
          else
            TAG="$(git rev-parse --short=12 HEAD)"; BUILD=true
          fi
          if [ -z "${TAG}" ]; then echo "No tag resolved" >&2; exit 1; fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "build=${BUILD}" >> "$GITHUB_OUTPUT"
          echo "Resolved tag=${TAG} build=${BUILD}"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::920887851546:role/westercove-app-frontend-deploy
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      # Build unless this is a rollback (dispatch with an explicit existing tag).
      - name: Build and push image (immutable-tagged)
        if: ${{ steps.tag.outputs.build == 'true' }}
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 \
            --build-arg EXPO_PUBLIC_API_URL="${API_URL}" \
            --build-arg EXPO_PUBLIC_COGNITO_USER_POOL_ID="${COGNITO_USER_POOL_ID}" \
            --build-arg EXPO_PUBLIC_COGNITO_CLIENT_ID="${COGNITO_CLIENT_ID}" \
            -t "${ECR_REPO}:${{ steps.tag.outputs.tag }}" .
          docker push "${ECR_REPO}:${{ steps.tag.outputs.tag }}"

      - name: Deploy frontend at the release tag
        run: |
          set -euo pipefail
          IMAGE="${ECR_REPO}:${{ steps.tag.outputs.tag }}"
          TD_ARN=$(aws ecs describe-services --cluster "${ECS_CLUSTER}" --services "${ECS_SERVICE}" \
            --query 'services[0].taskDefinition' --output text)
          aws ecs describe-task-definition --task-definition "${TD_ARN}" \
            --query 'taskDefinition' --output json > td.json
          jq --arg IMG "${IMAGE}" '
            .containerDefinitions[0].image = $IMG
            | {family,taskRoleArn,executionRoleArn,networkMode,containerDefinitions,volumes,placementConstraints,requiresCompatibilities,cpu,memory,runtimePlatform}
            | with_entries(select(.value != null))' td.json > td-new.json
          NEW_TD=$(aws ecs register-task-definition --cli-input-json file://td-new.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          aws ecs update-service --cluster "${ECS_CLUSTER}" --service "${ECS_SERVICE}" \
            --task-definition "${NEW_TD}" --no-cli-pager >/dev/null
          # Wait for steady state. Replaces `aws ecs wait services-stable` (40x15s=10min),
          # which red-Xed slow-but-successful cold starts (image pull + ALB health-check grace
          # can legitimately exceed 10min). Poll rolloutState up to WAIT_TIMEOUT, but FAIL FAST
          # on a genuinely bad rollout. Circuit breaker is DISABLED on this service, so
          # rolloutState never reports FAILED — we detect failure from STOPPED tasks instead.
          # Job still goes RED on: image pull error, ENI/secret init error, container crash
          # (non-zero exit), ELB health-check kill, or not-stable-within-WAIT_TIMEOUT.
          WAIT_TIMEOUT="${WAIT_TIMEOUT:-1200}"
          wait_stable() {
            local cluster="$1" service="$2"
            local deadline=$(( $(date +%s) + WAIT_TIMEOUT ))
            local out rollout running desired td stopped reasons exits
            while :; do
              out=$(aws ecs describe-services --cluster "$cluster" --services "$service" \
                --query 'services[0].deployments[?status==`PRIMARY`]|[0].[rolloutState,runningCount,desiredCount,taskDefinition]' \
                --output text)
              read -r rollout running desired td <<<"$out"
              if [ "$rollout" = "COMPLETED" ] && [ "$running" = "$desired" ]; then
                echo "OK: $service stable ($running/$desired) on $td"; return 0
              fi
              stopped=$(aws ecs list-tasks --cluster "$cluster" --service-name "$service" \
                --desired-status STOPPED --query 'taskArns' --output text)
              if [ -n "$stopped" ] && [ "$stopped" != "None" ]; then
                reasons=$(aws ecs describe-tasks --cluster "$cluster" --tasks $stopped \
                  --query "tasks[?taskDefinitionArn=='$td'].[stoppedReason,containers[0].reason]" --output text)
                if printf '%s\n' "$reasons" | grep -Eiq 'CannotPull|ResourceInitialization|ImagePull|CannotCreate|health checks'; then
                  echo "FAILED: $service bad rollout on $td:"; printf '%s\n' "$reasons"; return 1
                fi
                exits=$(aws ecs describe-tasks --cluster "$cluster" --tasks $stopped \
                  --query "tasks[?taskDefinitionArn=='$td'].containers[0].exitCode" --output text)
                if printf '%s' "$exits" | tr '[:space:]' '\n' | grep -Eq '^[1-9][0-9]*$'; then
                  echo "FAILED: $service task exited non-zero (crash) on $td (exit codes: $exits)"; return 1
                fi
              fi
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "FAILED: $service not stable within ${WAIT_TIMEOUT}s (rollout=$rollout running=$running/$desired)"; return 1
              fi
              sleep 15
            done
          }
          wait_stable "${ECS_CLUSTER}" "${ECS_SERVICE}"
          echo "Frontend release ${{ steps.tag.outputs.tag }} stable at ${NEW_TD}"
