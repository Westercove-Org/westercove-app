# Static-only SPA serve. The ALB routes API prefixes to the backend target group
# before requests reach here, so this server has NO proxy_pass — it only serves
# the Expo web bundle and falls back to index.html for client-side routes.
server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Hashed, immutable Expo assets: cache hard.
    location /_expo/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: anything not a real file resolves to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
